name: Desktop build

on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      DEVELOPER_DIR: ${{ matrix.os == 'macos-15' && '/Applications/Xcode_26.3.app/Contents/Developer' || '' }}
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12' # Windows MSI inspection uses the stdlib msilib module.
      - name: Install the repository Rust toolchain
        run: |
          rustup show
          rustup target add "$TARGET"
      - name: Use a short Windows build path
        if: runner.os == 'Windows'
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          # Cargo's nested CMake objects exceed MAX_PATH under github.workspace.
          # rust-cache joins the target path to the workspace, so keep it relative.
          target = Path(os.environ["RUNNER_TEMP"]) / "target"
          target_dir = os.path.relpath(target, Path.cwd())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              print(f"CARGO_TARGET_DIR={target_dir}", file=output)
          PYTHON
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust_cache
        with:
          workspaces: . -> ${{ env.CARGO_TARGET_DIR || 'target' }}
          # Cargo/native outputs and the Core Rust kernels follow the renderer
          # revision. The license tool has an independent cache below.
          key: ${{ matrix.target }}-static-v1-xcode26.3-${{ hashFiles('crates/macinrender/native/CMakeLists.txt') }}
          # Native Release outputs are shared across Cargo profiles in v2.
          prefix-key: v2-shared-native
          cache-workspace-crates: true
          cache-on-failure: false
          cache-directories: |
            .ci-tools
            .ci-inputs/native-dependencies
            .ci-inputs/macinrender
            .ci-inputs/ac4-core
      - name: Configure build reuse and parallelism
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          root = Path.cwd()
          jobs = min(4, os.cpu_count() or 2)
          settings = {
              "CARGO_BUILD_JOBS": jobs,
              "MACINRENDER_BUILD_JOBS": min(2, jobs),
              # Keep CMake outputs outside Cargo's target cache cleanup.
              "MACINRENDER_BUILD_DIR": root / ".ci-inputs/macinrender/build/player-native",
              "MACINDECODE_UI_FONT_CACHE_DIR": root / ".ci-tools/fonts",
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for key, value in settings.items():
                  print(f"{key}={value}", file=output)
                  print(f"{key}={value}")
          PYTHON
      - name: Compute license tool cache identity
        id: license_tool
        run: |
          python - <<'PYTHON'
          import os, sys
          sys.path.insert(0, "scripts")
          from package import ABOUT_VERSION
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={ABOUT_VERSION}", file=output)
          PYTHON
      - name: Restore license tool
        id: license_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: license-tool-${{ matrix.os }}-${{ matrix.target }}-${{ steps.license_tool.outputs.version }}
          path: .ci-tools/bin
      - name: Prepare and verify license tool
        run: |
          python - <<'PYTHON'
          import sys
          sys.path.insert(0, "scripts")
          from package import cargo_about
          print(cargo_about())
          PYTHON
      - name: Save verified license tool
        if: steps.license_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: license-tool-${{ matrix.os }}-${{ matrix.target }}-${{ steps.license_tool.outputs.version }}
          path: .ci-tools/bin
      - name: Prepare pinned native build tools and full decoder inputs
        run: |
          python -m pip install cmake==3.31.6 ninja==1.11.1.4
          python scripts/prepare_inputs.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Storage, SOFA and application tests
        run: cargo test --locked --workspace --all-targets --target "$TARGET"
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --target "$TARGET" -- -D warnings
      - name: Packaging regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and verify installer, relocated executable and window
        env:
          # With dependencies restored, the player's ThinLTO dominates this
          # step. Four workers regressed warm Windows builds; keep two there.
          CARGO_BUILD_JOBS: ${{ runner.os == 'Windows' && steps.rust_cache.outputs.cache-hit == 'true' && '2' || env.CARGO_BUILD_JOBS }}
        run: python scripts/package.py --target "$TARGET" --release-tag "$RELEASE_TAG"
      # Preserve the tested payload even if a later installer/runner check is
      # interrupted. Release publication still requires this whole job to pass.
      - name: Upload built installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.target }}
          path: |
            dist/*.msi
            dist/*.pkg
            dist/*.sha256
            dist/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Install, repair, upgrade, downgrade, uninstall and reinstall
        timeout-minutes: 10
        run: python scripts/check_lifecycle.py --target "$TARGET"
      - name: Upload failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            target/packaging-failures
            target/package-work/**/*.log
            target/package-work/**/*report.json
            target/package-work/**/install-check.json
          if-no-files-found: ignore
          retention-days: 7
