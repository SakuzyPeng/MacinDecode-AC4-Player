name: Desktop build

on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      DEVELOPER_DIR: ${{ matrix.os == 'macos-15' && '/Applications/Xcode_26.3.app/Contents/Developer' || '' }}
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12' # Windows MSI inspection uses the stdlib msilib module.
      - name: Install the repository Rust toolchain
        run: |
          rustup show
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Cargo/native outputs follow the renderer revision. OpenBLAS and
          # the license tool also have independently reusable caches below.
          key: ${{ matrix.target }}-static-v1-xcode26.3-${{ hashFiles('crates/macinrender/native/CMakeLists.txt') }}
          # Retire entries that may have been saved before Release compilation.
          prefix-key: v1-complete-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspace-crates: true
          cache-on-failure: false
          cache-directories: |
            .ci-tools
            .ci-inputs/native-dependencies
            .ci-inputs/macinrender
            .ci-inputs/openblas-static
      - name: Compute license tool cache identity
        id: license_tool
        run: |
          python - <<'PYTHON'
          import os, sys
          sys.path.insert(0, "scripts")
          from package import ABOUT_VERSION
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={ABOUT_VERSION}", file=output)
          PYTHON
      - name: Restore license tool
        id: license_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: license-tool-${{ matrix.os }}-${{ matrix.target }}-${{ steps.license_tool.outputs.version }}
          path: .ci-tools/bin
      - name: Prepare and verify license tool
        run: |
          python - <<'PYTHON'
          import sys
          sys.path.insert(0, "scripts")
          from package import cargo_about
          print(cargo_about())
          PYTHON
      - name: Save verified license tool
        if: steps.license_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: license-tool-${{ matrix.os }}-${{ matrix.target }}-${{ steps.license_tool.outputs.version }}
          path: .ci-tools/bin
      - name: Compute Windows OpenBLAS SDK cache identity
        if: runner.os == 'Windows'
        id: openblas_sdk
        run: python scripts/prepare_openblas.py --cache-info
      - name: Restore Windows OpenBLAS SDK
        if: runner.os == 'Windows'
        id: openblas_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ matrix.target }}-${{ steps.openblas_sdk.outputs.key }}
          path: ${{ steps.openblas_sdk.outputs.path }}
      - name: Prepare pinned native build tools and full decoder inputs
        run: |
          python -m pip install cmake==3.31.6 ninja==1.11.1.4
          python scripts/prepare_inputs.py
      - name: Save verified Windows OpenBLAS SDK
        if: runner.os == 'Windows' && steps.openblas_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ matrix.target }}-${{ steps.openblas_sdk.outputs.key }}
          path: ${{ steps.openblas_sdk.outputs.path }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Storage, SOFA and application tests
        run: cargo test --locked --workspace --all-targets --target "$TARGET"
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --target "$TARGET" -- -D warnings
      - name: Packaging regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and verify installer, relocated executable and window
        run: python scripts/package.py --target "$TARGET" --release-tag "$RELEASE_TAG"
      - name: Install, repair, upgrade, downgrade, uninstall and reinstall
        run: python scripts/check_lifecycle.py --target "$TARGET"
      - name: Upload verified installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.target }}
          path: |
            dist/*.msi
            dist/*.pkg
            dist/*.sha256
            dist/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.target }}
          path: target/packaging-failures
          if-no-files-found: ignore
          retention-days: 7
