[package]
name = "macindecode-macinrender"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
links = "macinrender"

[dependencies]
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# Use one Rust dependency graph/standard library, including under ThinLTO.
# Keep the revision aligned with native/CMakeLists.txt and the workspace patches.
mradm-ffi = { git = "https://github.com/SakuzyPeng/MacinRender-ADM-Core.git", rev = "d9d9086e3be2681fc950918e8888806c2f77ba6a" }

[build-dependencies]
cc = "1"
serde_json = "1"
shlex = "2"

[dev-dependencies]
tempfile = "3"
shlex = "2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
