[package]
name = "macindecode-ac4-player"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
eframe = { version = "=0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
rfd = { version = "=0.17.2", default-features = false, features = [
    "common-controls-v6",
    "wayland",
    "xdg-portal",
] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

