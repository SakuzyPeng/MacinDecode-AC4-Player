[package]
name = "macindecode-ac4-player"
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace]
members = ["crates/windows-spatial-audio", "crates/macinrender"]
default-members = [".", "crates/windows-spatial-audio"]
resolver = "3"

[dependencies]
eframe = { version = "=0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "persistence",
    "wayland",
    "wgpu",
    "x11",
] }
# Already in the tree via wgpu, so taking it as a direct dependency costs no
# extra compilation. Used only for the scene vertex cast in `scene3d::gpu`.
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
macindecode-ac4-inspect = { git = "https://github.com/SakuzyPeng/MacinDecode-AC4-Core.git", rev = "9673e1ef445e7e2ab218cc1b7b79f484fa92135f" }
# Core decode. Not platform-gated: these crates carry no `target_os` of their
# own and Core's release CI builds `audio-decode` for Linux, macOS and Windows
# alike. What is Windows-only is *playback*, which lives in the native crate
# below. The feature exists because the build needs the locally generated ETSI
# spec tables (see README), not because a platform cannot decode.
macindecode-ac4-bitstream = { git = "https://github.com/SakuzyPeng/MacinDecode-AC4-Core.git", rev = "9673e1ef445e7e2ab218cc1b7b79f484fa92135f", optional = true }
macindecode-ac4-mp4 = { git = "https://github.com/SakuzyPeng/MacinDecode-AC4-Core.git", rev = "9673e1ef445e7e2ab218cc1b7b79f484fa92135f", features = ["std"] }
macindecode-ac4-scene = { git = "https://github.com/SakuzyPeng/MacinDecode-AC4-Core.git", rev = "9673e1ef445e7e2ab218cc1b7b79f484fa92135f", features = ["audio-decode"], optional = true }
rfd = { version = "=0.17.2", default-features = false, features = [
    "common-controls-v6",
    "wayland",
    "xdg-portal",
] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.39", features = ["bundled", "backup"] }
tempfile = "3"
sha2 = "0.10"

[build-dependencies]
embed-resource = "=3.0.11"
sha2 = "0.10"

[dev-dependencies]
pollster = "0.4"
# The reference EBU R128 implementation, used only to cross-check our own
# K-weighting against it in `backend::state`'s tests. Deliberately not a runtime
# dependency: the measurement has to be re-readable at an arbitrary past
# presentation position, which a stateful integrator cannot do, and the app
# would otherwise carry a filter it only needs in order to agree with this one.
# `about.toml` sets `ignore-dev-dependencies`, so it stays out of the About list.
ebur128 = "0.1.10"

[features]
default = ["decode", "macinrender", "posebridge"]
posebridge = ["dep:posebridge-core"]
macinrender = ["decode", "dep:macindecode-macinrender"]
# Decoding is the point of the app, so it is on by default and a build without
# it is the explicit opt-out rather than a silent downgrade. `--no-default-features`
# gives the inspection-only shell, which is also the only configuration that
# builds without the spec tables.
decode = [
    "dep:macindecode-ac4-bitstream",
    "dep:macindecode-ac4-scene",
]

[target.'cfg(target_os = "windows")'.dependencies]
macindecode-windows-spatial-audio = { path = "crates/windows-spatial-audio" }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
macindecode-macinrender = { path = "crates/macinrender", optional = true }
posebridge-core = { git = "https://github.com/SakuzyPeng/PoseBridge.git", rev = "b8b6a415ecdff8a0e1f2fdd0979798d80f84ad21", optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
