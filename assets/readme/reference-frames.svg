<svg xmlns="http://www.w3.org/2000/svg" width="880" height="570" aria-labelledby="title desc" viewBox="0 0 880 570"><title id="title">MacinDecode AC-4 Player — reference frames</title><desc id="desc">The same two objects with the listener facing forward and then turned 45 degrees to the right. A scene-relative object keeps its place in the room, so its bearing to the listener changes from 100 to 55 degrees — which is what head tracking sounds like, the room staying put while you turn. A head-locked object keeps its bearing at 75 degrees, so its place in the room swings around with the head: it sounds unchanged, and only the picture moves. The player marks the first with a black element number and the second with a white one.</desc><style>.n{fill:none;stroke:#332a1f;stroke-width:1.15}.w .n{stroke:#fffefa}</style><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><path fill="#f8f3ea" stroke="#ece3d4" d="M.5.5h879v569H.5Z"/><path fill="#fffefa" d="M1 1h878v47H1Zm0 525h878v43H1Z"/><path stroke="#ece3d4" d="M1 48.5h878M1 526.5h878"/><text x="22" y="30" fill="#372c20" font-size="15" font-weight="600">Reference frames</text><text x="858" y="29" fill="#9a8b76" font-size="11" letter-spacing="1.3" text-anchor="end">IDs / SCENE vs HEAD</text><rect width="406" height="300" x="24" y="62" fill="#fffefa" stroke="#ece3d4" rx="4"/><text x="42" y="88" fill="#372c20" font-size="12.5" font-weight="600">Head forward</text><g transform="translate(227 200)"><path fill="#fcfaf4" d="m27.5 127.02-183.49-43.94L-27.5 20.32l183.49 43.94z"/><path fill="none" stroke="#cec4b6" d="m27.5 127.02 128.49-62.76"/><path fill="none" stroke="#cec4b6" d="m27.5 127.02-183.49-43.94"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m4.57 121.53 128.48-62.76"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m43.56 119.18-183.49-43.95"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m-18.37 116.04 128.48-62.76"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m