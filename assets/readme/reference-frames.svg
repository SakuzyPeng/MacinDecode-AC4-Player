"4"/><path fill="#332a1f" d="M24 376h3v62h-3z"/><rect width="22" height="22" x="42" y="396" fill="#ce7a3b" rx="3"/><text x="53" y="412" fill="#332a1f" font-size="12" font-weight="600" text-anchor="middle">1</text><text x="76" y="402" fill="#332a1f" font-size="12" font-weight="600">Scene relative</text><text x="76" y="421" fill="#372c20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5">room: same cell  ·  bearing: 100° → 55°</text><text x="370" y="402" fill="#372c20" font-size="11" font-weight="600">Keeps its place and gives up its bearing —</text><text x="370" y="421" fill="#9a8b76" font-size="10.5">this is what head tracking sounds like: the room stays put while you turn.</text><rect width="832" height="62" x="24" y="448" fill="#fffefa" stroke="#ece3d4" rx="4"/><path fill="#ce7a3b" d="M24 448h3v62h-3z"/><rect width="22" height="22" x="42" y="468" fill="#ce7a3b" rx="3"/><text x="53" y="484" fill="#fffefa" font-size="12" font-weight="600" text-anchor="middle">2</text><text x="76" y="474" fill="#ce7a3b" font-size="12" font-weight="600">Head locked</text><text x="76" y="493" fill="#372c20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5">room: swung 45°  ·  bearing: 75° → 75°</text><text x="370" y="474" fill="#372c20" font-size="11" font-weight="600">Keeps its bearing and gives up its place —</text><text x="370" y="493" fill="#9a8b76" font-size="10.5">it sounds unchanged as you turn, and only the picture moves.</text><text x="22" y="552" fill="#372c20" font-size="11">Black number = scene relative · white number = head locked</text><text x="858" y="552" fill="#9a8b76" font-size="11" text-anchor="end">System spatial audio cannot keep per-object head locking</text></g></svg>