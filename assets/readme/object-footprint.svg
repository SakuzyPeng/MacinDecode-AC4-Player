<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" aria-labelledby="title desc" viewBox="0 0 880 560"><title id="title">MacinDecode AC-4 Player — the object footprint</title><desc id="desc">With loudness enabled, an object&apos;s floor mark carries two readings on one decibel scale: a hairline ring at the gain the metadata asks for, and a filled core at the level actually measured. Three cases follow: a sounding object whose ring and core are close together, an object with a wide ring around a small core because it was positioned and gained but carries almost no signal, and a silent object whose core has bottomed out at the -36 dB floor while its readout shows minus infinity.</desc><style>.n{fill:none;stroke:#332a1f;stroke-width:1.15}</style><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><path fill="#f8f3ea" stroke="#ece3d4" d="M.5.5h879v559H.5Z"/><path fill="#fffefa" d="M1 1h878v47H1Zm0 515h878v43H1Z"/><path stroke="#ece3d4" d="M1 48.5h878M1 516.5h878"/><text x="22" y="30" fill="#372c20" font-size="15" font-weight="600">Object footprint</text><text x="858" y="29" fill="#9a8b76" font-size="11" letter-spacing="1.3" text-anchor="end">LVL / TWO READINGS</text><g transform="translate(250 235)"><path fill="#f1eade" d="M14.78 28.67-83.83 5.06l69.05-33.73L83.83-5.06z"/><path fill="#c0b5a4" d="M4.98 9.67-28.27 1.7-4.98-9.67 28.27-1.7z"/><path fill="none" stroke="#9a8b76" stroke-width="1.1" d="M7.47 14.49-42.36 2.55l34.89-17.04L42.36-2.55z"/><path fill="none" stroke="#9a8b76" stroke-width=".8" d="M0-82.88V0" opacity=".5"/><path fill="#d2844a" d="m27.58-121.76-32.44-7.76-22.72 11.09 32.44 7.77z"/><path d="m-1.87-114.59-12.61-3.02" class="n"/><path d="m-15.04-118.7 5.56-2.71" class="n"/><path d="m6.31-118.58-12.62-3.02" class="n"/><path d="m-6.87-122.69 5.56-2.72" class="n"/><path d="M14.48-122.58 1.87-125.6" class="n"/><path fill="#c07b47" d="m4.86-73.45 22.72-11.09v-37.22l-22.72 11.1z"/><path d="m11.8-108.84 8.83-4.32" class="n"/><path d="M21.94-111.65v9.11" class="n"/><path d="m11.8-95.45 8.83-4.31" class="n"/><path d="M21.94-98.25v9.1" class="n"/><path d="m11.8-82.05 8.83-4.31" class="n"/><path fill="#b07343" d="m-27.58-81.22 32.44 7.77v-37.21l-32.44-7.77z"/><path d="m-17.66-110.85 12.61 3.02" class="n"/><path d="M-3.18-105.23v9.1" class="n"/><path d="m-17.66-97.45 12.61 3.02" class="n"/><path d="M-3.18-91.84v9.11" class="n"/><path d="m-17.66-84.05 12.61 3.02" class="n"/><rect width="62" height="24" x="-31" y="-156.09" fill="#332a1f" opacity=".7" rx="3"/><text x="-23" y="-142.09" fill="#fbf7f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">−</text><text x="23" y="-142.09" fill="#fbf7f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="end">18.0</text><path fill="#332a1f" d="M-31-136.09h62v4h-62z" opacity=".35"/><path fill="#ce7a3b" d="M-31-136.09H0v4h-31z"/></g><text x="480" y="96" fill="#372c20" font-size="12" font-weight="600">nameplate</text><text x="480" y="111" fill="#9a8b76" font-size="11">dBFS, and nothing else</text><path fill="none" stroke="#b2a593" stroke-width=".9" d="M476 92H307l-26 10.91"/><circle cx="281" cy="102.91" r="1.8" fill="#b2a593"/><text x="480" y="232" fill="#372c20" font-size="12" font-weight="600">hairline ring</text><text x="480" y="247" fill="#9a8b76" font-size="11">the gain the metadata asks for</text><path fill="none" stroke="#b2a593" stroke-width=".9" d="M476 228H318.36l-26 4.45"/><circle cx="292.36" cy="232.45" r="1.8" fill="#b2a593"/><text x="196" y="300" fill="#372c20" font-size="12" font-weight="600" text-anchor="end">filled core</text><text x="196" y="315" fill="#9a8b76" font-size="11" text-anchor="end">the level actually measured</text><path fill="none" stroke="#b2a593" stroke-width=".9" d="M202 296h-2.27l22-59.3"/><circle cx="221.73" cy="236.7" r="1.8" fill="#b2a593"/><rect width="266" height="172" x="24" y="336" fill="#fffefa" stroke="#ece3d4" rx="4"/><text x="42" y="362" fill="#372c20" font-size="12" font-weight="600">Sounding</text><text x="272" y="362" fill="#372c20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="end">−9.0 dBFS</text><g transform="translate(157 425)"><path fill="#f1eade" d="M9.03 17.52-51.23 3.09l42.2-20.61L51.23-3.09z"/><path fill="#c0b5a4" d="m3.9 7.56-26.02-6.23L-3.9-7.56l26.02 6.23z"/><path fill="none" stroke="#9a8b76" stroke-width="1.1" d="m4.18 8.12-27.91-6.69 19.55-9.55 27.91 6.69z"/><path fill="none" stroke="#9a8b76" stroke-width=".8" d="M0-50.65V0" opacity=".5"/><path fill="#d2844a" d="m16.85-74.41-19.82-4.74-13.88 6.78 19.82 4.74z"/><path fill="#c07b47" d="m2.97-44.89 13.88-6.78v-22.74L2.97-67.63z"/><path fill="#b07343" d="m-16.85-49.63 19.82 4.74v-22.74l-19.82-4.74z"/></g><text x="42" y="462" fill="#9a8b76" font-size="10.5">Ring and core close together:</text><text x="42" y="475" fill="#9a8b76" font-size="10.5">the object delivers about</text><text x="42" y="488" fill="#9a8b76" font-size="10.5">what it was given.</text><rect width="266" height="172" x="306" y="336" fill="#fffefa" stroke="#ece3d4" rx="4"/><text x="324" y="362" fill="#b0483a" font-size="12" font-weight="600">Gained, empty</text><text x="554" y="362" fill="#372c20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="end">−33.0 dBFS</text><g transform="translate(439 425)"><path fill="#f1eade" d="M9.03 17.52-51.23 3.09l42.2-20.61L51.23-3.09z"/><path fill="#c0b5a4" d="M1.62 3.15-9.2.55l7.58-3.7L9.2-.55z"/><path fill="none" stroke="#b0483a" stroke-width="1.8" d="m4.47 8.67-29.82-7.14 20.88-10.2 29.82 7.14z"/><path fill="none" stroke="#9a8b76" stroke-width=".8" d="M0-50.65V0" opacity=".5"/><path fill="#d2844a" d="m16.85-74.41-19.82-4.74-13.88 6.78 19.82 4.74z"/><path fill="#c07b47" d="m2.97-44.89 13.88-6.78v-22.74L2.97-67.63z"/><path fill="#b07343" d="m-16.85-49.63 19.82 4.74v-22.74l-19.82-4.74z"/></g><text x="324" y="462" fill="#9a8b76" font-size="10.5">A wide ring around a small core:</text><text x="324" y="475" fill="#9a8b76" font-size="10.5">positioned, gained, and almost</text><text x="324" y="488" fill="#9a8b76" font-size="10.5">nothing in the track.</text><rect width="268" height="172" x="588" y="336" fill="#fffefa" stroke="#ece3d4" rx="4"/><text x="606" y="362" fill="#372c20" font-size="12" font-weight="600">Silent</text><text x="838" y="362" fill="#9a8b76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="end">−∞</text><g transform="translate(722 425)"><path fill="#f1eade" d="M9.03 17.52-51.23 3.09l42.2-20.61L51.23-3.09z"/><path fill="#c0b5a4" d="M1.34 2.59-7.58.46l6.24-3.05L7.58-.46z"/><path fill="none" stroke="#9a8b76" stroke-width="1.1" d="m4.47 8.67-29.82-7.14 20.88-10.2 29.82 7.14z"/><path fill="none" stroke="#9a8b76" stroke-width=".8" d="M0-50.65V0" opacity=".5"/><path fill="#d2844a" d="m16.85-74.41-19.82-4.74-13.88 6.78 19.82 4.74z"/><path fill="#c07b47" d="m2.97-44.89 13.88-6.78v-22.74L2.97-67.63z"/><path fill="#b07343" d="m-16.85-49.63 19.82 4.74v-22.74l-19.82-4.74z"/></g><text x="606" y="462" fill="#9a8b76" font-size="10.5">Below −36.0 dB the core bottoms</text><text x="606" y="475" fill="#9a8b76" font-size="10.5">out, and the readout has nothing</text><text x="606" y="488" fill="#9a8b76" font-size="10.5">finite to report.</text><text x="22" y="542" fill="#372c20" font-size="11">One decibel scale for both, with −36.0 dB at the floor</text><text x="858" y="542" fill="#9a8b76" font-size="11" text-anchor="end">The core can never exceed the ring</text></g></svg>