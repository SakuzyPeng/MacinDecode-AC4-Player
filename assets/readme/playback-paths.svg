<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" aria-labelledby="title desc" viewBox="0 0 880 440"><title id="title">MacinDecode AC-4 Player — playback paths</title><desc id="desc">One AC-4 decoder feeds three output paths. Windows object passthrough hands dynamic objects and a static LFE to Windows Spatial Audio. System spatial audio renders a VBAP speaker bed on Apple geometry and hands it to the system spatializer. SAF binaural renders HRTF, applies headphone compensation and an output limiter, and reaches any stereo device. The first two paths leave the player before two channels exist, which is why headphone compensation is available in the binaural path only.</desc><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><path fill="#f8f3ea" stroke="#ece3d4" d="M.5.5h879v439H.5Z"/><path fill="#fffefa" d="M1 1h878v47H1Zm0 395h878v43H1Z"/><path stroke="#ece3d4" d="M1 48.5h878M1 396.5h878"/><text x="22" y="30" fill="#372c20" font-size="15" font-weight="600">Playback paths</text><text x="858" y="29" fill="#9a8b76" font-size="11" letter-spacing="1.3" text-anchor="end">AC-4 / OUTPUT</text><text x="97" y="118" fill="#9a8b76" font-size="10.5" text-anchor="middle">.m4a · .mp4 · .ac4</text><path fill="none" stroke="#9a8b76" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="m95 130 4 4-4 4"/><rect width="146" height="48" x="24" y="146" fill="#f4e2d1" stroke="#e5bd9b" rx="4"/><text x="97" y="169" fill="#372c20" font-size="11.5" font-weight="600" text-anchor="middle">AC-4 decoder</text><text x="97" y="184" fill="#9a8b76" font-size="10" text-anchor="middle">no system codec</text><path fill="none" stroke="#9a8b76" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="m95 202 4 4-4 4"/><rect width="146" height="48" x="24" y="218" fill="#f4e2d1" stroke="#e5bd9b" rx="4"/><text x="97" y="241" fill="#372c20" font-size="11.5" font-weight="600" text-anchor="middle">Objects + LFE</text><text x="97" y="256" fill="#9a8b76" font-size="10" text-anchor="middle">per-object metadata</text><text x="200" y="99" fill="#9a8b76" font-size="9.5" font-weight="600" letter-spacing="1.1">WINDOWS OBJECT PASSTHROUGH</text><path fill="none" stroke="#b6aa99" stroke-width="1.1" d="M170 242c16 0 16-112 30-112"/><rect width="244" height="46" x="200" y="107" fill="#f4e2d1" stroke="#e5bd9b" rx="4"/><text x="322" y="129" fill="#372c20" font-size="11.5" font-weight="600" text-anchor="middle">Dynamic objects + static LFE</text><text x="322" y="144" fill="#9a8b76" font-size="10" text-anchor="middle">submitted per render quantum</text><path fill="none" stroke="#9a8b76" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="m450 126 4 4-4 4"/><rect width="244" height="46" x="460" y="107" fill="#e5ded3" stroke="#c0b5a4" rx="4"/><text x="582" y="129" fill="#372c20" font-size="11.5" font-weight="600" text-anchor="middle">Windows Spatial Audio</text><text x="582" y="144" fill="#9a8b76" font-size="10" text-anchor="middle">one position and gain per quantum</text><path fill="none" stroke="#9a8b76" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="m710 126 4 4-4 4"/><rect width="136" height="46" x="720" y="107" fill="#fffefa" stroke="#bbaf9f" rx="4"/><text x="788" y="134" fill="#372c20" font-size="11.5" font-weight="600" text-anchor="middle">Spatial-audio endpoint</text><text x="200" y="168" fill="#9a8b76" font-size="10">Needs enough dynamic-object slots: 16 for AC-4 L3, 20 for L4.</text><text x="200" y="201" fill="#9a8b76" font-size="9.5" font-weight="600" letter-spacing="1.1">SYSTEM SPATIAL AUDIO</text><path fill="none" stroke="#b6aa99" stroke-width="1.1" d="M170 242c16 0 16-10 30-10"/><rect width="244" height="46" x="200" y="209" fill="#f4e2d1" stroke="#e5bd9b" rx="4"/><text x="322" y="231" fill="#372c20" font-size="11.5" font-weight="600" text-anchor="middle">SAF VBAP bed</text><text x="322" y="246" fill="#9a8b76" font-size="10" text-anchor="middle">7.1.4 · 9.1.6 · 22.2, Apple geometry</text><path fill="none" stroke="#9a8b76" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="m450 228 4 4-4 4"/><rect width="244" height="46" x="460" y="209" fill="#e5ded3" stroke="#c0b5a4" rx="4"/><text x="582" y="231" fill="#372c20" font-size="11.5" font-weight="600" text-anchor="middle">System spatializer</text><text x="582" y="246" fill="#9a8b76" font-size="10" text-anchor="middle">the OS does the head tracking</text><path fill="none" stroke="#9a8b76" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="m710 228 4 4-4 4"/><rect width="136" height="46" x="720" y="209" fill="#fffefa" stroke="#bbaf9f" rx="4"/><text x="788" y="236" fill="#372c20" font-size="11.5" font-weight="600" text-anchor="middle">Selected output</text><text x="200" y="270" fill="#9a8b76" font-size="10">The bed leaves as many channels; the final two are formed outside the player.</text><text x="200" y="303" fill="#9a8b76" font-size="9.5" font-weight="600" letter-spacing="1.1">SAF BINAURAL</text><path fill="none" stroke="#b6aa99" stroke-width="1.1" d="M170 242c16 0 16 92 30 92"/><rect width="158" height="46" x="200" y="311" fill="#f4e2d1" stroke="#e5bd9b" rx="4"/><text x="279" y="333" fill="#372c20" font-size="11.5" font-weight="600" text-anchor="middle">SAF HRTF</text><text x="279" y="348" fill="#9a8b76" font-size="10" text-anchor="middle">KEMAR or your SOFA</text><path fill="none" stroke="#9a8b76" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="m364 330 4 4-4 4"/><rect width="158" height="46" x="374" y="311" fill="#f4e2d1" stroke="#e5bd9b" rx="4"/><text x="453" y="333" fill="#372c20" font-size="11.5" font-weight="600" text-anchor="middle">HpTF</text><text x="453" y="348" fill="#9a8b76" font-size="10" text-anchor="middle">AutoEq · Bass · Tilt</text><path fill="none" stroke="#9a8b76" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="m538 330 4 4-4 4"/><rect width="156" height="46" x="548" y="311" fill="#f4e2d1" stroke="#e5bd9b" rx="4"/><text x="626" y="333" fill="#372c20" font-size="11.5" font-weight="600" text-anchor="middle">Output limiter</text><text x="626" y="348" fill="#9a8b76" font-size="10" text-anchor="middle">peak ceiling</text><path fill="none" stroke="#9a8b76" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="m710 330 4 4-4 4"/><rect width="136" height="46" x="720" y="311" fill="#fffefa" stroke="#bbaf9f" rx="4"/><text x="788" y="338" fill="#372c20" font-size="11.5" font-weight="600" text-anchor="middle">Any stereo device</text><text x="200" y="372" fill="#9a8b76" font-size="10">The one path that forms the two channels itself — which is why HpTF lives here alone.</text><rect width="8" height="8" x="22" y="415" fill="#f4e2d1" stroke="#e5bd9b" rx="1"/><text x="36" y="422" fill="#372c20" font-size="11">in the player</text><rect width="8" height="8" x="150" y="415" fill="#e5ded3" stroke="#c0b5a4" rx="1"/><text x="164" y="422" fill="#372c20" font-size="11">operating system</text><rect width="8" height="8" x="300" y="415" fill="#fffefa" stroke="#bbaf9f" rx="1"/><text x="314" y="422" fill="#372c20" font-size="11">output device</text><text x="858" y="422" fill="#9a8b76" font-size="11" text-anchor="end">Automatic: passthrough on Windows, system spatial on macOS</text></g></svg>