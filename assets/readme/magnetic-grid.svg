<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" aria-labelledby="title desc" viewBox="0 0 880 470"><title id="title">MacinDecode AC-4 Player — magnetic coverage grid</title><desc id="desc">The Magnetic page&apos;s coverage grid, enlarged. Twelve columns of heading run from directly behind through left, forward and right to behind again; four rows split the sphere by the sine of elevation at plus 30, 0 and minus 30 degrees, so every cell holds the same forty-eighth of the sphere. The forward column and the horizon are drawn heavier. Cells deepen with readings up to six and then stop. One empty cell is outlined as the target, the nearest direction not read yet, and a small square marks the latest reading beside it. Under the grid the page&apos;s instruction reads Turn it to its left, with the count of directions read and the reminder that coverage is not progress.</desc><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><path fill="#f8f3ea" stroke="#ece3d4" d="M.5.5h879v469H.5Z"/><path fill="#fffefa" d="M1 1h878v47H1Zm0 425h878v43H1Z"/><path stroke="#ece3d4" d="M1 48.5h878M1 426.5h878"/><text x="22" y="30" fill="#372c20" font-size="15" font-weight="600">Magnetic coverage</text><text x="858" y="29" fill="#9a8b76" font-size="11" letter-spacing="1.3" text-anchor="end">MAG / COVERAGE</text><path fill="#f8f3ea" d="M66 92h36v36H66z"/><path fill="#f8f3ea" d="M102 92h36v36h-36z"/><path fill="#f8f3ea" d="M138 92h36v36h-36z"/><path fill="#eed1b8" d="M174 92h36v36h-36z"/><path fill="#e1ae86" d="M210 92h36v36h-36z"/><path fill="#ce7a3b" d="M246 92h36v36h-36z"/><path fill="#ce7a3b" d="M282 92h36v36h-36z"/><path fill="#db9d6d" d="M318 92h36v36h-36z"/><path fill="#e7bf9f" d="M354 92h36v36h-36z"/><path fill="#f8f3ea" d="M390 92h36v36h-36z"/><path fill="#f8f3ea" d="M426 92h36v36h-36z"/><path fill="#f8f3ea" d="M462 92h36v36h-36z"/><path fill="#f8f3ea" d="M66 128h36v36H66z"/><path fill="#e7bf9f" d="M102 128h36v36h-36z"/><path fill="#db9d6d" d="M138 128h36v36h-36z"/><path fill="#ce7a3b" d="M174 128h36v36h-36z"/><path fill="#ce7a3b" d="M210 128h36v36h-36z"/><path fill="#ce7a3b" d="M246 128h36v36h-36z"/><path fill="#ce7a3b" d="M282 128h36v36h-36z"/><path fill="#ce7a3b" d="M318 128h36v36h-36z"/><path fill="#ce7a3b" d="M354 128h36v36h-36z"/><path fill="#d48b54" d="M390 128h36v36h-36z"/><path fill="#e1ae86" d="M426 128h36v36h-36z"/><path fill="#eed1b8" d="M462 128h36v36h-36z"/><path fill="#f8f3ea" d="M66 164h36v36H66z"/><path fill="#f8f3ea" d="M102 164h36v36h-36z"/><path fill="#eed1b8" d="M138 164h36v36h-36z"/><path fill="#e1ae86" d="M174 164h36v36h-36z"/><path fill="#ce7a3b" d="M210 164h36v36h-36z"/><path fill="#ce7a3b" d="M246 164h36v36h-36z"/><path fill="#ce7a3b" d="M282 164h36v36h-36z"/><path fill="#db9d6d" d="M318 164h36v36h-36z"/><path fill="#f8f3ea" d="M354 164h36v36h-36z"/><path fill="#f8f3ea" d="M390 164h36v36h-36z"/><path fill="#f8f3ea" d="M426 164h36v36h-36z"/><path fill="#f8f3ea" d="M462 164h36v36h-36z"/><path fill="#f8f3ea" d="M66 200h36v36H66z"/><path fill="#f8f3ea" d="M102 200h36v36h-36z"/><path fill="#f8f3ea" d="M138 200h36v36h-36z"/><path fill="#f8f3ea" d="M174 200h36v36h-36z"/><path fill="#f8f3ea" d="M210 200h36v36h-36z"/><path fill="#e7bf9f" d="M246 200h36v36h-36z"/><path fill="#eed1b8" d="M282 200h36v36h-36z"/><path fill="#f8f3ea" d="M318 200h36v36h-36z"/><path fill="#f8f3ea" d="M354 200h36v36h-36z"/><path fill="#f8f3ea" d="M390 200h36v36h-36z"/><path fill="#f8f3ea" d="M426 200h36v36h-36z"/><path fill="#f8f3ea" d="M462 200h36v36h-36z"/><path fill="none" stroke="#cfc4b3" d="M102 92v144"/><path fill="none" stroke="#cfc4b3" d="M138 92v144"/><path fill="none" stroke="#cfc4b3" d="M174 92v144"/><path fill="none" stroke="#cfc4b3" d="M210 92v144"/><path fill="none" stroke="#cfc4b3" d="M246 92v144"/><path fill="none" stroke="#cfc4b3" d="M318 92v144"/><path fill="none" stroke="#cfc4b3" d="M354 92v144"/><path fill="none" stroke="#cfc4b3" d="M390 92v144"/><path fill="none" stroke="#cfc4b3" d="M426 92v144"/><path fill="none" stroke="#cfc4b3" d="M462 92v144"/><path fill="none" stroke="#cfc4b3" d="M66 128h432"/><path fill="none" stroke="#cfc4b3" d="M66 200h432"/><path fill="none" stroke="#7a6b57" d="M282 92v144"/><path fill="none" stroke="#7a6b57" d="M66 164h432"/><path fill="none" stroke="#ece3d4" d="M65.5 91.5h433v145h-433z"/><path fill="none" stroke="#332a1f" stroke-width="2" d="M355 165h34v34h-34z"/><path fill="#fffefa" d="M337.5 178.13h9v9h-9z"/><path fill="#332a1f" d="M338.5 179.13h7v7h-7z"/><text x="58" y="96" fill="#7a6b57" font-size="11" text-anchor="end">+90°</text><text x="58" y="132" fill="#7a6b57" font-size="11" text-anchor="end">+30°</text><text x="58" y="168" fill="#7a6b57" font-size="11" text-anchor="end">0°</text><text x="58" y="204" fill="#7a6b57" font-size="11" text-anchor="end">−30°</text><text x="58" y="240" fill="#7a6b57" font-size="11" text-anchor="end">−90°</text><text x="66" y="251" fill="#7a6b57" font-size="11">Back</text><text x="174" y="251" fill="#7a6b57" font-size="11" text-anchor="middle">Left</text><text x="282" y="251" fill="#7a6b57" font-size="11" text-anchor="middle">Forward</text><text x="390" y="251" fill="#7a6b57" font-size="11" text-anchor="middle">Right</text><text x="498" y="251" fill="#7a6b57" font-size="11" text-anchor="end">Back</text><text x="22" y="290" fill="#372c20" font-size="17">Turn it to its left</text><text x="22" y="310" fill="#372c20" font-size="10">The marker is the field as the headset sees it, so it moves against</text><text x="22" y="323" fill="#372c20" font-size="10">the headset. Follow the words to bring it into the outlined cell.</text><text x="22" y="355" fill="#372c20" font-size="12">25 / 48 directions · 212 readings</text><text x="22" y="375" fill="#372c20" font-size="10">Coverage is not progress: a full grid says every direction was read, not that the sensor is calibrated.</text><text x="560" y="106" fill="#372c20" font-size="11.5" font-weight="600">one cell</text><text x="560" y="120" fill="#9a8b76" font-size="10.5">1/48 of the sphere: rows split by the sine of</text><text x="560" y="133" fill="#9a8b76" font-size="10.5">elevation, so a full grid is a covered sphere</text><path fill="none" stroke="#b2a593" stroke-width=".9" d="M552 110h-52"/><circle cx="500" cy="110" r="1.8" fill="#b2a593"/><text x="560" y="178" fill="#372c20" font-size="11.5" font-weight="600">target</text><text x="560" y="192" fill="#9a8b76" font-size="10.5">the nearest direction not read yet</text><path fill="none" stroke="#b2a593" stroke-width=".9" d="M552 182H392"/><circle cx="392" cy="182" r="1.8" fill="#b2a593"/><text x="560" y="214" fill="#372c20" font-size="11.5" font-weight="600">latest reading</text><text x="560" y="228" fill="#9a8b76" font-size="10.5">where the field points now, measured from</text><text x="560" y="241" fill="#9a8b76" font-size="10.5">the centre the readings were fitted around</text><path fill="none" stroke="#b2a593" stroke-width=".9" d="M552 218H348l-6-29.87"/><circle cx="342" cy="188.13" r="1.8" fill="#b2a593"/><text x="560" y="300" fill="#372c20" font-size="11.5" font-weight="600">fill</text><path fill="#eed1b8" stroke="#cfc4b3" d="M560 310h20v20h-20z"/><text x="570" y="344" fill="#9a8b76" font-size="10" text-anchor="middle">1</text><path fill="#e7bf9f" stroke="#cfc4b3" d="M586 310h20v20h-20z"/><text x="596" y="344" fill="#9a8b76" font-size="10" text-anchor="middle">2</text><path fill="#e1ae86" stroke="#cfc4b3" d="M612 310h20v20h-20z"/><text x="622" y="344" fill="#9a8b76" font-size="10" text-anchor="middle">3</text><path fill="#db9d6d" stroke="#cfc4b3" d="M638 310h20v20h-20z"/><text x="648" y="344" fill="#9a8b76" font-size="10" text-anchor="middle">4</text><path fill="#d48b54" stroke="#cfc4b3" d="M664 310h20v20h-20z"/><text x="674" y="344" fill="#9a8b76" font-size="10" text-anchor="middle">5</text><path fill="#ce7a3b" stroke="#cfc4b3" d="M690 310h20v20h-20z"/><text x="700" y="344" fill="#9a8b76" font-size="10" text-anchor="middle">6+</text><text x="560" y="366" fill="#9a8b76" font-size="10.5">readings in the cell; the colour stops deepening at 6,</text><text x="560" y="379" fill="#9a8b76" font-size="10.5">so a well-read grid never looks further along than it is</text><text x="22" y="452" fill="#372c20" font-size="11">Drawn in headset axes, through the sensor mounting</text><text x="858" y="452" fill="#9a8b76" font-size="11" text-anchor="end">Every number is a reading, not a verdict on the sensor</text></g></svg>