<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" aria-labelledby="title desc" viewBox="0 0 880 430"><title id="title">MacinDecode AC-4 Player — persistently silent objects</title><desc id="desc">Three stages of a silent object. While sounding, its nameplate reads a level and the footprint&apos;s core answers its gain ring. When the signal stops the readout turns to minus infinity and the plate steps back to a dim. After two seconds of silence and a six-tenths-of-a-second fade the plate is gone and the cube is a ghost, but the gain ring stays on the floor, because full gain with an empty track is the fault worth seeing. With fading switched off the cube stays fully drawn instead.</desc><style>.n{fill:none;stroke:#332a1f;stroke-width:1.15}</style><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><path fill="#f8f3ea" stroke="#ece3d4" d="M.5.5h879v429H.5Z"/><path fill="#fffefa" d="M1 1h878v47H1Zm0 385h878v43H1Z"/><path stroke="#ece3d4" d="M1 48.5h878M1 386.5h878"/><text x="22" y="30" fill="#372c20" font-size="15" font-weight="600">Persistently silent objects</text><text x="858" y="29" fill="#9a8b76" font-size="11" letter-spacing="1.3" text-anchor="end">FADE / WHAT STAYS</text><rect width="260" height="208" x="24" y="62" fill="#fffefa" stroke="#ece3d4" rx="4"/><text x="42" y="88" fill="#372c20" font-size="12" font-weight="600">Sounding</text><g transform="translate(154 200)"><path fill="#f1eade" d="m6.16 11.95-41.09-9.84 28.77-14.06 41.09 9.84z"/><path fill="#c0b5a4" d="M2.06 3.99-11.67.7l9.61-4.69L11.67-.7z"/><path fill="none" stroke="#9a8b76" stroke-width="1.1" d="m2.98 5.79-19.9-4.77 13.94-6.81 19.9 4.77z"/><path fill="none" stroke="#9a8b76" stroke-width=".8" d="M0-34.53V0" opacity=".5"/><path fill="#d2844a" d="m11.49-50.73-13.52-3.24-9.46 4.62 13.52 3.24z"/><path d="M-.78-47.75-6.03-49" class="n"/><path d="m-6.27-49.46 2.32-1.13" class="n"/><path d="m2.63-49.41-5.26-1.26" class="n"/><path d="m-2.86-51.12 2.32-1.13" class="n"/><path d="M6.03-51.07.78-52.33" class="n"/><path fill="#c07b47" d="m2.03-30.6 9.46-4.63v-15.5l-9.46 4.62z"/><path d="m4.92-45.35 3.68-1.8" class="n"/><path d="M9.14-46.52v3.79" class="n"/><path d="m4.92-39.77 3.68-1.8" class="n"/><path d="M9.14-40.94v3.8" class="n"/><path d="m4.92-34.19 3.68-1.79" class="n"/><path fill="#b07343" d="M-11.49-33.84 2.03-30.6v-15.51l-13.52-3.24z"/><path d="m-7.36-46.19 5.26 1.26" class="n"/><path d="M-1.33-43.85v3.8" class="n"/><path d="m-7.36-40.6 5.26 1.25" class="n"/><path d="M-1.33-38.27v3.8" class="n"/><path d="m-7.36-35.02 5.26 1.26" class="n"/><rect width="62" height="24" x="-31" y="-86.04" fill="#332a1f" opacity=".7" rx="3"/><text x="-23" y="-72.04" fill="#fbf7f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">−</text><text x="23" y="-72.04" fill="#fbf7f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="end">18.3</text><path fill="#332a1f" d="M-31-66.04h62v4h-62z" opacity=".35"/><path fill="#ce7a3b" d="M-31-66.04H-.52v4H-31z"/></g><text x="42" y="240" fill="#9a8b76" font-size="10">The plate reads the level, the core</text><text x="42" y="253" fill="#9a8b76" font-size="10">answers the ring.</text><rect width="260" height="208" x="310" y="62" fill="#fffefa" stroke="#ece3d4" rx="4"/><text x="328" y="88" fill="#372c20" font-size="12" font-weight="600">Signal stops</text><g transform="translate(440 200)"><path fill="#f1eade" d="m6.16 11.95-41.09-9.84 28.77-14.06 41.09 9.84z"/><path fill="#c0b5a4" d="M.91 1.77-5.17.31l4.26-2.08L5.17-.31z"/><path fill="none" stroke="#9a8b76" stroke-width="1.1" d="m2.98 5.79-19.9-4.77 13.94-6.81 19.9 4.77z"/><path fill="none" stroke="#9a8b76" stroke-width=".8" d="M0-34.53V0" opacity=".5"/><path fill="#d2844a" d="m11.49-50.73-13.52-3.24-9.46 4.62 13.52 3.24z"/><path d="M-.78-47.75-6.03-49" class="n"/><path d="m-6.27-49.46 2.32-1.13" class="n"/><path d="m2.63-49.41-5.26-1.26" class="n"/><path d="m-2.86-51.12 2.32-1.13" class="n"/><path d="M6.03-51.07.78-52.33" class="n"/><path fill="#c07b47" d="m2.03-30.6 9.46-4.63v-15.5l-9.46 4.62z"/><path d="m4.92-45.35 3.68-1.8" class="n"/><path d="M9.14-46.52v3.79" class="n"/><path d="m4.92-39.77 3.68-1.8" class="n"/><path d="M9.14-40.94v3.8" class="n"/><path d="m4.92-34.19 3.68-1.79" class="n"/><path fill="#b07343" d="M-11.49-33.84 2.03-30.6v-15.51l-13.52-3.24z"/><path d="m-7.36-46.19 5.26 1.26" class="n"/><path d="M-1.33-43.85v3.8" class="n"/><path d="m-7.36-40.6 5.26 1.25" class="n"/><path d="M-1.33-38.27v3.8" class="n"/><path d="m-7.36-35.02 5.26 1.26" class="n"/><rect width="62" height="24" x="-31" y="-86.04" fill="#332a1f" opacity=".22" rx="3"/><text x="-23" y="-72.04" fill="#fbf7f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" opacity=".32">−</text><text x="-14" y="-72.04" fill="#fbf7f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" opacity=".32">∞</text><path fill="#332a1f" d="M-31-66.04h62v4h-62z" opacity=".11"/></g><text x="328" y="240" fill="#9a8b76" font-size="10">The readout turns to −∞ and the plate</text><text x="328" y="253" fill="#9a8b76" font-size="10">steps back to a dim that stays readable.</text><rect width="260" height="208" x="596" y="62" fill="#fffefa" stroke="#ece3d4" rx="4"/><text x="614" y="88" fill="#372c20" font-size="12" font-weight="600">After 2 s</text><g transform="translate(726 200)"><path fill="#f1eade" d="m6.16 11.95-41.09-9.84 28.77-14.06 41.09 9.84z"/><path fill="#dfd7ca" d="M.91 1.77-5.17.31l4.26-2.08L5.17-.31z"/><path fill="none" stroke="#b0483a" stroke-width="1.8" d="m2.98 5.79-19.9-4.77 13.94-6.81 19.9 4.77z"/><path fill="none" stroke="#9a8b76" stroke-width=".8" d="M0-34.53V0" opacity=".5"/><g opacity=".32"><path fill="#e7c2a2" d="m11.49-50.73-13.52-3.24-9.46 4.62 13.52 3.24z"/><path d="M-.78-47.75-6.03-49" class="n"/><path d="m-6.27-49.46 2.32-1.13" class="n"/><path d="m2.63-49.41-5.26-1.26" class="n"/><path d="m-2.86-51.12 2.32-1.13" class="n"/><path d="M6.03-51.07.78-52.33" class="n"/><path fill="#d3b194" d="m2.03-30.6 9.46-4.63v-15.5l-9.46 4.62z"/><path d="m4.92-45.35 3.68-1.8" class="n"/><path d="M9.14-46.52v3.79" class="n"/><path d="m4.92-39.77 3.68-1.8" class="n"/><path d="M9.14-40.94v3.8" class="n"/><path d="m4.92-34.19 3.68-1.79" class="n"/><path fill="#bfa286" d="M-11.49-33.84 2.03-30.6v-15.51l-13.52-3.24z"/><path d="m-7.36-46.19 5.26 1.26" class="n"/><path d="M-1.33-43.85v3.8" class="n"/><path d="m-7.36-40.6 5.26 1.25" class="n"/><path d="M-1.33-38.27v3.8" class="n"/><path d="m-7.36-35.02 5.26 1.26" class="n"/></g></g><text x="614" y="240" fill="#9a8b76" font-size="10">The plate is gone and the cube is a ghost —</text><text x="614" y="253" fill="#9a8b76" font-size="10">but the gain ring is still on the floor.</text><path fill="none" stroke="#c98478" stroke-width=".9" d="M786 150h-16l-27.08 48.98"/><circle cx="742.92" cy="198.98" r="1.8" fill="#c98478"/><text x="790" y="146" fill="#b0483a" font-size="10.5" font-weight="600">stays</text><rect width="54" height="17" x="614" y="98" fill="#e0d9cd" rx="8.5"/><text x="641" y="110" fill="#372c20" font-size="9.5" text-anchor="middle">Silent 1</text><path fill="none" stroke="#bbaf9f" d="M154 300h572"/><circle cx="154" cy="300" r="3" fill="#9a8b76"/><circle cx="440" cy="300" r="3" fill="#9a8b76"/><circle cx="726" cy="300" r="3" fill="#9a8b76"/><text x="297" y="292" fill="#9a8b76" font-size="10" text-anchor="middle">the signal stops</text><text x="583" y="292" fill="#9a8b76" font-size="10" text-anchor="middle">2 s of silence, then a 0.6 s fade</text><rect width="832" height="52" x="24" y="322" fill="#fffefa" stroke="#ece3d4" rx="4"/><path fill="#9a8b76" d="M24 322h3v52h-3z"/><text x="44" y="344" fill="#372c20" font-size="11.5" font-weight="600">Fade persistently silent objects — off</text><text x="44" y="362" fill="#9a8b76" font-size="10.5">The cube stays fully drawn and the plate rests at its dim; the Silent count disappears. The silence clock keeps running, so switching back on finds each object where it is.</text><text x="22" y="412" fill="#372c20" font-size="11">The plate dims the instant the readout turns to −∞</text><text x="858" y="412" fill="#b0483a" font-size="11" text-anchor="end">The gain ring never fades</text></g></svg>