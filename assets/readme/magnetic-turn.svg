#7a6b57" font-size="11" text-anchor="end">Back</text><path fill="none" stroke="#332a1f" stroke-width="1.2" d="M704.67 338.49h17"/><path fill="none" stroke="#332a1f" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="m719.17 335.49 3 3-3 3"/><text x="468" y="396" fill="#9a8b76" font-size="10.5">Dashed: where the square was. It went right.</text><rect width="832" height="62" x="24" y="428" fill="#fffefa" stroke="#ece3d4" rx="4"/><path fill="#332a1f" d="M24 428h3v62h-3z"/><path fill="none" stroke="#332a1f" stroke-width="1.6" d="M42 459h20"/><path fill="none" stroke="#332a1f" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="m59 455 4 4-4 4"/><text x="76" y="454" fill="#332a1f" font-size="12" font-weight="600">The field</text><text x="76" y="473" fill="#372c20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5">room: fixed  ·  bearing: 50° → 80°</text><text x="370" y="454" fill="#372c20" font-size="11" font-weight="600">Keeps its place and changes its bearing —</text><text x="370" y="473" fill="#9a8b76" font-size="10.5">the headset turned; the Earth&apos;s field did not.</text><rect width="832" height="62" x="24" y="500" fill="#fffefa" stroke="#ece3d4" rx="4"/><path fill="#ce7a3b" d="M24 500h3v62h-3z"/><path fill="#fffefa" d="M47.5 526.5h9v9h-9z"/><path fill="#332a1f" d="M48.5 527.5h7v7h-7z"/><text x="76" y="526" fill="#ce7a3b" font-size="12" font-weight="600">The square</text><text x="76" y="545" fill="#372c20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5">column 7 → 8  ·  moved right</text><text x="370" y="526" fill="#372c20" font-size="11" font-weight="600">Shows that bearing, so it moves against the turn —</text><text x="370" y="545" fill="#9a8b76" font-size="10.5">follow the words, not the square.</text><text x="22" y="604" fill="#372c20" font-size="11">The instruction names the headset&apos;s motion</text><text x="858" y="604" fill="#9a8b76" font-size="11" text-anchor="end">Drawn on a head for its facing; turn the headset in your hands</text></g></svg>