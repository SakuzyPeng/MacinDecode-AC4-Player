<svg xmlns="http://www.w3.org/2000/svg" width="880" height="622" aria-labelledby="title desc" viewBox="0 0 880 622"><title id="title">MacinDecode AC-4 Player — following a magnetic instruction</title><desc id="desc">Two rooms, before and after following the instruction Turn it to its left. The Earth&apos;s field is drawn as an arrow fixed in the room, 50 degrees right of where the headset first faces. Turning the headset 30 degrees to its left leaves the field where it is, so its bearing from the headset grows from 50 to 80 degrees. Below each room is the grid row the field is read in: the square that marks the latest reading moves one column to the right, into the outlined cell, while the headset turned left. The square shows the field as the headset sees it, so it always moves against the headset; the page&apos;s words name the motion to make.</desc><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><path fill="#f8f3ea" stroke="#ece3d4" d="M.5.5h879v621H.5Z"/><path fill="#fffefa" d="M1 1h878v47H1Zm0 577h878v43H1Z"/><path stroke="#ece3d4" d="M1 48.5h878M1 578.5h878"/><text x="22" y="30" fill="#372c20" font-size="15" font-weight="600">Following the instruction</text><text x="858" y="29" fill="#9a8b76" font-size="11" letter-spacing="1.3" text-anchor="end">MAG / FIELD vs HEADSET</text><rect width="406" height="350" x="24" y="62" fill="#fffefa" stroke="#ece3d4" rx="4"/><text x="42" y="88" fill="#372c20" font-size="12.5" font-weight="600">The field 50° right of forward</text><g transform="translate(227 174)"><path fill="#fcfaf4" d="m27.5 127.02-183.49-43.94L-27.5 20.32l183.49 43.94z"/><path fill="none" stroke="#cec4b6" d="m27.5 127.02 128.49-62.76"/><path fill="none" stroke="#cec4b6" d="m27.5 127.02-183.49-43.94"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m4.57 121.53 128.48-62.76"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m43.56 119.18-183.49-43.95"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m-18.37 116.04 1