e="#332a1f" stroke-width="1.15" d="M135.03 92.39v8.12"/></g></g><rect width="58" height="20" x="780" y="76" fill="#fbf7f0" stroke="#ece3d4" rx="3"/><text x="809" y="90" fill="#372c20" font-size="10" font-weight="600" text-anchor="middle">PERSP</text><text x="468" y="368" fill="#9a8b76" font-size="10.5">Distance separates them, and the footprints come back.</text><rect width="832" height="116" x="24" y="396" fill="#fffefa" stroke="#ece3d4" rx="4"/><text x="42" y="422" fill="#372c20" font-size="11.5" font-weight="600">The footprint carries gain by growing, so a quiet object&apos;s is narrower than its own cube</text><rect width="18" height="18" x="42" y="440" fill="#ce7a3b" rx="2"/><text x="51" y="453" fill="#fffefa" font-size="10" font-weight="600" text-anchor="middle">1</text><text x="68" y="446" fill="#372c20" font-size="10.5">−3 dB → 1.50×</text><text x="68" y="460" fill="#9a8b76" font-size="10.5">visible either way</text><rect width="18" height="18" x="242" y="440" fill="#ce7a3b" rx="2"/><text x="251" y="453" fill="#fffefa" font-size="10" font-weight="600" text-anchor="middle">2</text><text x="268" y="446" fill="#372c20" font-size="10.5">−14 dB → 1.15×</text><text x="268" y="460" fill="#9a8b76" font-size="10.5">visible either way</text><rect width="18" height="18" x="442" y="440" fill="#ce7a3b" rx="2"/><text x="451" y="453" fill="#fffefa" font-size="10" font-weight="600" text-anchor="middle">3</text><text x="468" y="446" fill="#372c20" font-size="10.5">−26 dB → 0.77×</text><text x="468" y="460" fill="#b0483a" font-size="10.5">hidden in ORTHO</text><rect width="18" height="18" x="642" y="440" fill="#ce7a3b" rx="2"/><text x="651" y="453" fill="#fffefa" font-size="10" font-weight="600" text-anchor="middle">4</text><text x="668" y="446" fill="#372c20" font-size="10.5">−33 dB → 0.55×</text><text x="668" y="460" fill="#b0483a" font-size="10.5">hidden in ORTHO</text><text x="42" y="490" fill="#9a8b76" font-size="10.5">The crossover is −18.8 dB. Below it only perspective separates the two — by more the further the object sits from the view axis, so an object near it stays covered.</text><text x="22" y="542" fill="#372c20" font-size="11">Straight down on the same four objects</text><text x="858" y="542" fill="#9a8b76" font-size="11" text-anchor="end">Parallel edges stay parallel in ORTHO and converge in PERSP</text></g></svg>