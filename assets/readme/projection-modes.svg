none" stroke="#332a1f" stroke-width="1.15" d="M457.06 449.54v4.43"/><path fill="none" stroke="#332a1f" stroke-width="1.15" d="M448.98 455.01h7.04"/><text x="472" y="446" fill="#372c20" font-size="10.5">−26 dB → 0.77×</text><text x="472" y="460" fill="#b0483a" font-size="10.5">hidden in ORTHO</text><rect width="21" height="21" x="642" y="438" fill="#ce7a3b" rx="2"/><path fill="none" stroke="#332a1f" stroke-width="1.15" d="M647.94 443.03v4.43"/><path fill="none" stroke="#332a1f" stroke-width="1.15" d="M657.06 443.03v4.43"/><path fill="none" stroke="#332a1f" stroke-width="1.15" d="M648.98 448.5h7.04"/><path fill="none" stroke="#332a1f" stroke-width="1.15" d="M657.06 449.54v4.43"/><text x="672" y="446" fill="#372c20" font-size="10.5">−33 dB → 0.55×</text><text x="672" y="460" fill="#b0483a" font-size="10.5">hidden in ORTHO</text><text x="42" y="488" fill="#9a8b76" font-size="10.5">The crossover is −18.8 dB. Below it only perspective separates the two —</text><text x="42" y="502" fill="#9a8b76" font-size="10.5">by more the further the object sits from the view axis, so one near the axis stays covered.</text><text x="22" y="542" fill="#372c20" font-size="11">Straight down on the same four objects</text><text x="858" y="542" fill="#9a8b76" font-size="11" text-anchor="end">Everything at one height scales together; only height separates them</text></g></svg>