="M111.14 76.94h17.11v17.11h-17.11z"/><rect width="31.35" height="31.35" x="104.02" y="69.83" fill="#ce7a3b" rx="1.5"/><text x="119.7" y="89.5" fill="#fffefa" font-size="11" font-weight="600" text-anchor="middle">4</text></g></g><rect width="58" height="20" x="354" y="76" fill="#fbf7f0" stroke="#ece3d4" rx="3"/><text x="383" y="90" fill="#372c20" font-size="10" font-weight="600" text-anchor="middle">ORTHO</text><text x="42" y="368" fill="#9a8b76" font-size="10.5">Height is ignored, so each cube covers its own footprint.</text><rect width="406" height="320" x="450" y="62" fill="#fffefa" stroke="#ece3d4" rx="4"/><clipPath id="p1"><rect width="404" height="286" x="451" y="63" rx="4"/></clipPath><g clip-path="url(#p1)"><g transform="translate(653 206)"><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-171.88-171.88v343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-171.88-171.88h343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-137.51-171.88v343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-171.88-137.51h343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-103.13-171.88v343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-171.88-103.13h343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-68.75-171.88v343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-171.88-68.75h343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-34.38-171.88v343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-171.88-34.38h343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M0-171.88v343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-171.88 0h343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M34.38-171.88v343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-171.88 34.38h343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M68.75-171.88v343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-171.88 68.75h343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M103.13-171.88v343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-171.88 103.13h343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M137.51-171.88v343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-171.88 137.51h343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M171.88-171.88v343.76"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-171.88 171.88h343.76"/><path fill="none" stroke="#9a8b76" stroke-width="1.3" d="M-127.65-101.21h43.75v43.75h-43.75z"/><rect width="33.04" height="33.04" x="-136.66" y="-106.62" fill="#ce7a3b" rx="1.5"/><text x="-120.14" y="-86.11" fill="#fffefa" font-size="11" font-weight="600" text-anchor="middle">1</text><path fill="none" stroke="#9a8b76" stroke-width="1.3" d="M99.58-90.81h33.53v33.53H99.58z"/><rect width="33.27" height="33.27" x="116.45" y="-101.33" fill="#ce7a3b" rx="1.5"/><text x="133.09" y="-80.69" fill="#fffefa" font-size="11" font-weight="600" text-anchor="middle">2</text><path fill="none" stroke="#9a8b76" stroke-width="1.3" d="M-111.68 73.43h22.38v22.38h-22.38z"/><rect width="33.19" height="33.19" x="-131.27" y="79.97" fill="#ce7a3b" rx="1.5"/><text x="-114.67" y="100.56" fill="#fffefa" font-size="11" font-weight="600" text-anchor="middle">3</text><path fill="none" stroke="#9a8b76" stroke-width="1.3" d="M103.12 71.39H119v15.88h-15.88z"/><rect width="32.96" height="32.96" x="109.37" y="73.41" fill="#ce7a3b" rx="1.5"/><text x="125.85" y="93.89" fill="#fffefa" font-size="11" font-weight="600" text-anchor="middle">4</text></g></g><rect width="58" height="20" x="780" y="76" fill="#fbf7f0" stroke="#ece3d4" rx="3"/><text x="809" y="90" fill="#372c20" font-size="10" font-weight="600" text-anchor="middle">PERSP</text><text x="468" y="368" fill="#9a8b76" font-size="10.5">Distance separates them, and the footprints come back.</text><rect width="832" height="116" x="24" y="396" fill="#fffefa" stroke="#ece3d4" rx="4"/><text x="42" y="422" fill="#372c20" font-size="11.5" font-weight="600">The footprint carries gain by growing, so a quiet object&apos;s is narrower than its own cube</text><rect width="18" height="18" x="42" y="440" fill="#ce7a3b" rx="2"/><text x="51" y="453" fill="#fffefa" font-size="10" font-weight="600" text-anchor="middle">1</text><text x="68" y="446" fill="#372c20" font-size="10.5">−3 dB · footprint 1.50x the cube</text><text x="68" y="460" fill="#9a8b76" font-size="10.5">visible either way</text><rect width="18" height="18" x="250" y="440" fill="#ce7a3b" rx="2"/><text x="259" y="453" fill="#fffefa" font-size="10" font-weight="600" text-anchor="middle">2</text><text x="276" y="446" fill="#372c20" font-size="10.5">−14 dB · footprint 1.15x the cube</text><text x="276" y="460" fill="#9a8b76" font-size="10.5">visible either way</text><rect width="18" height="18" x="440" y="440" fill="#ce7a3b" rx="2"/><text x="449" y="453" fill="#fffefa" font-size="10" font-weight="600" text-anchor="middle">3</text><text x="466" y="446" fill="#372c20" font-size="10.5">−26 dB · footprint 0.77x the cube</text><text x="466" y="460" fill="#b0483a" font-size="10.5">hidden in ORTHO</text><rect width="18" height="18" x="640" y="440" fill="#ce7a3b" rx="2"/><text x="649" y="453" fill="#fffefa" font-size="10" font-weight="600" text-anchor="middle">4</text><text x="666" y="446" fill="#372c20" font-size="10.5">−33 dB · footprint 0.55x the cube</text><text x="666" y="460" fill="#b0483a" font-size="10.5">hidden in ORTHO</text><text x="42" y="490" fill="#9a8b76" font-size="10.5">The crossover is −18.8 dB. Below it only perspective separates the two — by more the further the object sits from the view axis, so an object near it stays covered.</text><text x="22" y="542" fill="#372c20" font-size="11">Straight down on the same four objects</text><text x="858" y="542" fill="#9a8b76" font-size="11" text-anchor="end">Parallel edges stay parallel in ORTHO and converge in PERSP</text></g></svg>