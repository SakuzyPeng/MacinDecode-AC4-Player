<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" aria-labelledby="title desc" viewBox="0 0 880 560"><title id="title">MacinDecode AC-4 Player — orthographic and perspective</title><desc id="desc">The same four objects seen straight down in both projections. The floor footprint carries gain by growing, so an object quieter than -18.8 dB has a footprint narrower than its own cube. An orthographic straight-down view puts a cube and the footprint beneath it on exactly the same pixels, so those footprints are hidden entirely. Perspective divides by distance to the camera, sliding each cube off its footprint — by more the further the object sits from the view axis — so the footprints reappear.</desc><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><path fill="#f8f3ea" stroke="#ece3d4" d="M.5.5h879v559H.5Z"/><path fill="#fffefa" d="M1 1h878v47H1Zm0 515h878v43H1Z"/><path stroke="#ece3d4" d="M1 48.5h878M1 516.5h878"/><text x="22" y="30" fill="#372c20" font-size="15" font-weight="600">Projection</text><text x="858" y="29" fill="#9a8b76" font-size="11" letter-spacing="1.3" text-anchor="end">ORTHO / PERSP</text><rect width="406" height="320" x="24" y="62" fill="#fffefa" stroke="#ece3d4" rx="4"/><clipPath id="p0"><rect width="404" height="286" x="25" y="63" rx="4"/></clipPath><g clip-path="url(#p0)"><g transform="translate(227 206)"><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-185.25-185.25v370.5"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-185.25-185.25h370.5"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-148.2-185.25v370.5"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-185.25-148.2h370.5"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-111.15-185.25v370.5"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-185.25-111.15h370.5"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-74.1-185.25v370.5"/><path fill="none" stroke="#dcd4c7" stroke-width=".8" d="M-185.25-