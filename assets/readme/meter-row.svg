<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" aria-labelledby="title desc" viewBox="0 0 880 400"><title id="title">MacinDecode AC-4 Player — a meter bank row</title><desc id="desc">One meter bank row enlarged and labelled: the object number, a track whose bar fills from the left with the measured level, a tick at the gain the metadata asked for on the same scale, a peak marker that holds 1.6 seconds and then slides, a red segment at full scale when a sample clipped, and the readout. Beside it the bank as laid out, with a unit button controlling dBFS and LUFS-M for every row and the scene, including LFE channel zero. Another row has a bar far short of its gain tick — an object positioned and gained with nothing in its track.</desc><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><path fill="#f8f3ea" stroke="#ece3d4" d="M.5.5h879v399H.5Z"/><path fill="#fffefa" d="M1 1h878v47H1Zm0 355h878v43H1Z"/><path stroke="#ece3d4" d="M1 48.5h878M1 356.5h878"/><text x="22" y="30" fill="#372c20" font-size="15" font-weight="600">Meter bank row</text><text x="858" y="29" fill="#9a8b76" font-size="11" letter-spacing="1.3" text-anchor="end">LVL / METER BANK</text><text x="236" y="126" fill="#372c20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" text-anchor="end">3</text><rect width="400" height="40" x="260" y="100" fill="#f1e9dc" rx="1"/><rect width="266.67" height="40" x="260" y="100" fill="#ce7a3b" rx="1"/><path fill="none" stroke="#9a8b76" d="M637.78 100v40"/><path fill="none" stroke="#332a1f" stroke-width="1.5" d="M593.33 100v40"/><path fill="#b0483a" d="M652 100h8v40h-8z"/><text x="730" y="126" fill="#372c20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" text-anchor="end">−12.7</text><text x="260" y="72" fill="#372c20" font-size="11.5" font-weight="600">level</text><text x="260" y="86" fill="#9a8b76" font-size="10.5">the bar fills from the left</text><path fill="none" stroke="#b2a593" stroke-width=".9" d="M350 92v8"/><text x="600" y="72" fill="#372c20" font-size="11.5" font-weight="600" text-anchor="end">peak</text><text x="600" y="86" fill="#9a8b76" font-size="10.5" text-anchor="end">holds 1.6 s, then slides</text><path fill="none" stroke="#b2a593" stroke-width=".9" d="M593.33 92v8"/><text x="858" y="72" fill="#b0483a" font-size="11.5" font-weight="600" text-anchor="end">clip</text><text x="858" y="86" fill="#9a8b76" font-size="10.5" text-anchor="end">a sample reached full scale</text><path fill="none" stroke="#cd8c80" stroke-width=".9" d="m740 92-84 8"/><text x="236" y="164" fill="#372c20" font-size="11.5" font-weight="600" text-anchor="end">number</text><path fill="none" stroke="#b2a593" stroke-width=".9" d="M236 152v-18"/><text x="637.78" y="164" fill="#372c20" font-size="11.5" font-weight="600" text-anchor="middle">gain</text><text x="637.78" y="178" fill="#9a8b76" font-size="10.5" text-anchor="middle">what the metadata asked for, on the same scale</text><path fill="none" stroke="#b2a593" stroke-width=".9" d="M637.78 152v-12"/><rect width="276" height="148" x="24" y="200" fill="#fffefa" stroke="#ece3d4" rx="4"/><text x="42" y="226" fill="#9a8b76" font-size="10" font-weight="600" letter-spacing=".6">METER BANK</text><rect width="58" height="20" x="222" y="214" fill="#fbf7f0" stroke="#ece3d4" rx="3"/><text x="251" y="228" fill="#372c20" font-size="10" font-weight="600" text-anchor="middle">LUFS-M</text><text x="42" y="245" fill="#9a8b76" font-size="10">tick = gain · line = peak · red = clip</text><text x="56" y="267" fill="#372c20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" text-anchor="end">0</text><rect width="168" height="10" x="64" y="259" fill="#f1e9dc" rx="1"/><rect width="98" height="10" x="64" y="259" fill="#ce7a3b" rx="1"/><path fill="none" stroke="#9a8b76" d="M232 259v10"/><path fill="none" stroke="#332a1f" stroke-width="1.5" d="M171.33 259v10"/><text x="282" y="267" fill="#372c20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" text-anchor="end">−15.7</text><text x="56" y="285" fill="#372c20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" text-anchor="end">1</text><rect width="168" height="10" x="64" y="277" fill="#f1e9dc" rx="1"/><rect width="140" height="10" x="64" y="277" fill="#ce7a3b" rx="1"/><path fill="none" stroke="#9a8b76" d="M208.67 277v10"/><path fill="none" stroke="#332a1f" stroke-width="1.5" d="M213.33 277v10"/><text x="282" y="285" fill="#372c20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" text-anchor="end">−6.7</text><text x="56" y="303" fill="#b0483a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" text-anchor="end">2</text><rect width="168" height="10" x="64" y="295" fill="#f1e9dc" rx="1"/><rect width="158.67" height="10" x="64" y="295" fill="#ce7a3b" rx="1"/><path fill="none" stroke="#9a8b76" d="M227.33 295v10"/><path fill="none" stroke="#332a1f" stroke-width="1.5" d="M231.07 295v10"/><path fill="#b0483a" d="M229 295h3v10h-3z"/><text x="282" y="303" fill="#b0483a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" text-anchor="end">−2.7</text><rect width="252" height="18" x="38" y="310" fill="#f7ece7" rx="3"/><text x="56" y="321" fill="#372c20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" text-anchor="end">3</text><rect width="168" height="10" x="64" y="313" fill="#f1e9dc" rx="1"/><rect width="23.33" height="10" x="64" y="313" fill="#ce7a3b" rx="1"/><path fill="none" stroke="#9a8b76" d="M218 313v10"/><path fill="none" stroke="#332a1f" stroke-width="1.5" d="M96.67 313v10"/><text x="282" y="321" fill="#372c20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" text-anchor="end">−31.7</text><text x="56" y="339" fill="#9a8b76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" text-anchor="end">4</text><rect width="168" height="10" x="64" y="331" fill="#f1e9dc" rx="1"/><path fill="none" stroke="#9a8b76" d="M194.67 331v10"/><path fill="none" stroke="#332a1f" stroke-width="1.5" d="M64 331v10"/><text x="282" y="339" fill="#9a8b76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" text-anchor="end">−∞</text><text x="364" y="226" fill="#372c20" font-size="11.5" font-weight="600">Two units, one button</text><text x="364" y="244" fill="#9a8b76" font-size="10.5">dBFS — fast 30 ms levels with meter ballistics.</text><text x="364" y="259" fill="#9a8b76" font-size="10.5">LUFS-M — K-weighted 400 ms channel loudness, unballistic.</text><text x="364" y="274" fill="#9a8b76" font-size="10.5">One selection for rows 0–20, nameplates, footprints and trails.</text><text x="364" y="306" fill="#b0483a" font-size="11.5" font-weight="600">A bar far short of the tick</text><text x="364" y="324" fill="#9a8b76" font-size="10.5">Positioned, gained, and nothing in the track — the same case the</text><text x="364" y="339" fill="#9a8b76" font-size="10.5">footprint shows, read exactly here instead of by eye.</text><path fill="none" stroke="#cd8c80" stroke-width=".9" d="M360 302h-48l-6 19"/><circle cx="306" cy="321" r="1.8" fill="#cd8c80"/><text x="22" y="382" fill="#372c20" font-size="11">One row per channel, including LFE 0</text><text x="858" y="382" fill="#9a8b76" font-size="11" text-anchor="end">Clipping is the one reading that is not weighted at all</text></g></svg>