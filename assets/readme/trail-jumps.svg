<svg xmlns="http://www.w3.org/2000/svg" width="880" height="464" aria-labelledby="title desc" viewBox="0 0 880 464"><title id="title">MacinDecode AC-4 Player — object trails and jumps</title><desc id="desc">Two trails across the same room over the same 400 milliseconds. In the first every mark is a solid cube and the spacing is even, so the object travelled and the gaps read as its speed. In the second the marks bunch at each side and the two facing the gap are hollow outlines, with a short arrow at the end the object left pointing the way it went. Nothing joins the two hollow marks, because none of that distance was travelled: the metadata moved the object instantly. Whether an update was instant is a fact read off the bitstream; whether the distance is worth a marker is a threshold in the player. Each mark also drops a smaller projection onto the floor grid, which is what places the path when the view is grazing.</desc><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><path fill="#f8f3ea" stroke="#ece3d4" d="M.5.5h879v463H.5Z"/><path fill="#fffefa" d="M1 1h878v47H1Zm0 419h878v43H1Z"/><path stroke="#ece3d4" d="M1 48.5h878M1 420.5h878"/><text x="22" y="30" fill="#372c20" font-size="15" font-weight="600">Object trails and jumps</text><text x="858" y="29" fill="#9a8b76" font-size="11" letter-spacing="1.3" text-anchor="end">TRAIL EXAMPLE</text><rect width="404" height="250" x="24" y="62" fill="#fffefa" stroke="#ece3d4" rx="4"/><text x="42" y="88" fill="#372c20" font-size="12" font-weight="600">Travelled</text><g transform="translate(226,46)"><path fill="#fcfaf4" d="m27.63 218.03-184.31-44.13 129.05-63.04L156.68 155z"/><path fill="none" stroke="#cec4b6" d="M27.63 218.03 156.68 155"/><path fill="none" stroke="#cec4b6" d="m27.63 218.03-184.31-44.13"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m-3.09 210.68 129.05-63.04"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m49.14 207.53-184.31-44.14"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m-33.81 203.32 129.06-63.04"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m70.65 197.02-184.31-44.14"/><path fill="none" stroke="#cec4b6" d="m-64.53 195.96 129.06-63.03"/><path fill="none" stroke="#cec4b6" d="m92.15 186.52-184.3-44.14"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m-95.25 188.61 129.06-63.04"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m113.66 176.01-184.31-44.14"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="M-125.96 181.25 3.09 118.21"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m135.17 165.5-184.31-44.14"/><path fill="none" stroke="#cec4b6" d="m-156.68 173.9 129.05-63.04"/><path fill="none" stroke="#cec4b6" d="m156.68 155-184.31-44.14"/><path fill="#f4e6d8" d="m-111.79 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#efdac5" d="m-106.75 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#dbc7b4" d="m-111.49 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#c6b4a2" d="m-118.25 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#f2e1d1" d="m-86.79 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#ecd0b7" d="m-81.75 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#d8bfa7" d="m-86.49 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#c5ad98" d="m-93.25 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#f0ddca" d="m-61.79 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#e9c7aa" d="m-56.75 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#d5b79c" d="m-61.49 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#c2a68d" d="m-68.25 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#efd8c3" d="m-36.79 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#e5be9c" d="m-31.75 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#d2ae90" d="m-36.49 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#bf9f83" d="m-43.25 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#edd4bd" d="m-11.79 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#e2b48f" d="m-6.75 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#cfa584" d="m-11.49 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#bc9879" d="m-18.25 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#ebcfb6" d="m13.21 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#dfab81" d="m18.25 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#cd9d78" d="m13.51 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#ba916e" d="m6.75 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#eacab0" d="m38.21 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#dca275" d="m43.25 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#ca966d" d="m38.51 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#b88964" d="m31.75 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#e8c6a9" d="m63.21 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#d89967" d="m68.25 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#c78e61" d="m63.51 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#b5835b" d="m56.75 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#e7c1a2" d="m88.21 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#d68f5a" d="m93.25 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#c58555" d="m88.51 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#b37b51" d="m81.75 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#e5bd9b" d="m113.21 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#d2864c" d="m118.25 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#c17d49" d="m113.51 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#b17546" d="m106.75 109.94 6.76 1.62v-7.76l-6.76-1.61z"/></g><text x="42" y="272" fill="#9a8b76" font-size="10.5">Ten marks, evenly spaced. Nothing is hollow, so every gap was</text><text x="42" y="285" fill="#9a8b76" font-size="10.5">crossed — and how wide they are is how fast it was going.</text><rect width="404" height="250" x="452" y="62" fill="#fffefa" stroke="#ece3d4" rx="4"/><text x="470" y="88" fill="#372c20" font-size="12" font-weight="600">Jumped</text><g transform="translate(654,46)"><path fill="#fcfaf4" d="m27.63 218.03-184.31-44.13 129.05-63.04L156.68 155z"/><path fill="none" stroke="#cec4b6" d="M27.63 218.03 156.68 155"/><path fill="none" stroke="#cec4b6" d="m27.63 218.03-184.31-44.13"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m-3.09 210.68 129.05-63.04"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m49.14 207.53-184.31-44.14"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m-33.81 203.32 129.06-63.04"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m70.65 197.02-184.31-44.14"/><path fill="none" stroke="#cec4b6" d="m-64.53 195.96 129.06-63.03"/><path fill="none" stroke="#cec4b6" d="m92.15 186.52-184.3-44.14"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m-95.25 188.61 129.06-63.04"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m113.66 176.01-184.31-44.14"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="M-125.96 181.25 3.09 118.21"/><path fill="none" stroke="#e3dcd0" stroke-width=".7" d="m135.17 165.5-184.31-44.14"/><path fill="none" stroke="#cec4b6" d="m-156.68 173.9 129.05-63.04"/><path fill="none" stroke="#cec4b6" d="m156.68 155-184.31-44.14"/><path fill="#f4e6d8" d="m-111.79 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#efdac5" d="m-106.75 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#dbc7b4" d="m-111.49 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#c6b4a2" d="m-118.25 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#f2e1d1" d="m-99.29 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#ecd0b7" d="m-94.25 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#d8bfa7" d="m-98.99 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#c5ad98" d="m-105.75 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#f0ddca" d="m-86.79 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#e9c7aa" d="m-81.75 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#d5b79c" d="m-86.49 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#c2a68d" d="m-93.25 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#efd8c3" d="m-74.29 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#e5be9c" d="m-69.25 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#d2ae90" d="m-73.99 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#bf9f83" d="m-80.75 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#e5bd9b" d="m-61.79 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="none" stroke="#ce7a3b" stroke-width="1.15" d="m-60.88 115.06-10.81-2.59m18.38-1.11-10.81-2.59m3.24-6.11-10.81-2.59m18.38-1.11-10.81-2.59m3.24 18.69v-12.4m7.57 8.7v-12.4m-18.38 13.51v-12.4m7.57 8.7v-12.4m3.24 18.69 7.57-3.7m-7.57-8.7 7.57-3.7m-18.38 13.51 7.57-3.7m-7.57-8.7 7.57-3.7"/><path fill="#e5bd9b" d="m63.21 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="none" stroke="#ce7a3b" stroke-width="1.15" d="m64.12 115.06-10.81-2.59m18.38-1.11-10.81-2.59m3.24-6.11-10.81-2.59m18.38-1.11-10.81-2.59m3.24 18.69v-12.4m7.57 8.7v-12.4m-18.38 13.51v-12.4m7.57 8.7v-12.4m3.24 18.69 7.57-3.7m-7.57-8.7 7.57-3.7m-18.38 13.51 7.57-3.7m-7.57-8.7 7.57-3.7"/><path fill="#eacab0" d="m75.71 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#dca275" d="m80.75 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#ca966d" d="m76.01 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#b88964" d="m69.25 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#e8c6a9" d="m88.21 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#d89967" d="m93.25 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#c78e61" d="m88.51 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#b5835b" d="m81.75 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#e7c1a2" d="m100.71 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#d68f5a" d="m105.75 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#c58555" d="m101.01 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#b37b51" d="m94.25 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="#e5bd9b" d="m113.21 165.82-4.73-1.13 3.31-1.62 4.73 1.13z"/><path fill="#d2864c" d="m118.25 101.49-6.76-1.62-4.74 2.32 6.76 1.61z"/><path fill="#c17d49" d="m113.51 111.56 4.74-2.31v-7.76l-4.74 2.31z"/><path fill="#b17546" d="m106.75 109.94 6.76 1.62v-7.76l-6.76-1.61z"/><path fill="none" stroke="#ce7a3b" stroke-width="1.15" d="M-52.6 105.72h26"/><path fill="none" stroke="#ce7a3b" stroke-width="1.15" d="m-26.6 105.72-7.63 4.76"/><path fill="none" stroke="#ce7a3b" stroke-width="1.15" d="m-26.6 105.72-7.63-4.77"/></g><text x="470" y="272" fill="#9a8b76" font-size="10.5">The same span over the same 400 ms, but it was never in</text><text x="470" y="285" fill="#9a8b76" font-size="10.5">between. Two hollow ends, an arrow, and nothing joining them.</text><path fill="none" stroke="#b2a593" stroke-width=".9" d="M589.5 133.72v10"/><text x="583.5" y="127.72" fill="#372c20" font-size="10" text-anchor="middle">left here</text><path fill="none" stroke="#b2a593" stroke-width=".9" d="M714.5 133.72v10"/><text x="720.5" y="127.72" fill="#372c20" font-size="10" text-anchor="middle">appeared here</text><rect width="832" height="70" x="24" y="328" fill="#fffefa" stroke="#ece3d4" rx="4"/><path fill="#9a8b76" d="M24 328h3v70h-3z"/><text x="44" y="350" fill="#372c20" font-size="11.5" font-weight="600">Two questions, and they are not the same one</text><text x="44" y="368" fill="#9a8b76" font-size="10.5">Was it a discontinuity? A fact, read off the metadata in backend::state: a position update whose ramp is zero frames.</text><text x="44" y="382" fill="#9a8b76" font-size="10.5">Is it worth a marker? A judgement, and it lives in params.rs: the two ends must be 0.3 apart in a room that spans −1 to 1.</text><text x="22" y="446" fill="#372c20" font-size="11">Age is the only thing a trail encodes — the hollow marks are the exception, and never fade</text><text x="858" y="446" fill="#b0483a" font-size="11" text-anchor="end">No line, because none of it was travelled</text></g></svg>