<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="orbit-title orbit-description">
  <title id="orbit-title">MacinDecode — 环绕播放</title>
  <desc id="orbit-description">奶油白圆角底座上，陶橙色播放三角被一条倾斜的开放轨道环绕，轨道缺口中悬浮一个声源点。</desc>
  <defs>
    <linearGradient id="orbit-tile-fill" x1="256" y1="28" x2="256" y2="484" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFEFA"/>
      <stop offset="1" stop-color="#F5EDE0"/>
    </linearGradient>
    <linearGradient id="orbit-play-fill" x1="212" y1="157" x2="306" y2="342" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DC9458"/>
      <stop offset="0.56" stop-color="#CE7A3B"/>
      <stop offset="1" stop-color="#C27138"/>
    </linearGradient>
    <radialGradient id="orbit-source-fill" cx="342" cy="153" r="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8A771"/>
      <stop offset="0.58" stop-color="#CE7A3B"/>
      <stop offset="1" stop-color="#A75D35"/>
    </radialGradient>
    <filter id="orbit-tile-shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#332A1F" flood-opacity="0.14"/>
    </filter>
    <filter id="orbit-ground-blur" x="106" y="365" width="300" height="76" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="orbit-play-shadow" x="175" y="135" width="202" height="255" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#6C452A" flood-opacity="0.13"/>
    </filter>
  </defs>
  <g id="orbit-base">
    <rect x="28" y="24" width="456" height="456" rx="104" fill="url(#orbit-tile-fill)" filter="url(#orbit-tile-shadow)"/>
    <rect x="28.75" y="24.75" width="454.5" height="454.5" rx="103.25" stroke="#E9DECE" stroke-width="1.5"/>
    <path d="M 55 100 C 69 62 98 38 146 36 H 366 C 414 36 443 62 457 100" stroke="#FFFEFA" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>
  <g id="orbit-symbol">
    <ellipse cx="256" cy="400" rx="100" ry="8" fill="#70543C" opacity="0.13" filter="url(#orbit-ground-blur)"/>
    <path id="orbit-rear-ring" d="M 143.782 -14.934 A 146 86 0 1 1 -146 0 A 146 86 0 0 1 83.742 -70.447" transform="translate(256 258) rotate(-28)" stroke="#C1AC90" stroke-width="10" stroke-linecap="round"/>
    <g filter="url(#orbit-play-shadow)">
      <path id="orbit-play-depth" d="M 204 169 C 204 161 212 157 219 162 L 336 240 C 345 246 345 254 336 260 L 219 338 C 212 343 204 339 204 331 Z" transform="translate(0 9)" fill="#A75D35"/>
      <path id="orbit-play-front" d="M 204 169 C 204 161 212 157 219 162 L 336 240 C 345 246 345 254 336 260 L 219 338 C 212 343 204 339 204 331 Z" fill="url(#orbit-play-fill)"/>
      <path d="M 206 170 C 206 163 212 160 218 164 L 334 241" stroke="#F6C69B" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    </g>
    <path id="orbit-front-ring" d="M 141.025 22.258 A 146 86 0 0 1 -143.782 14.934" transform="translate(256 258) rotate(-28)" stroke="#8F775D" stroke-width="11" stroke-linecap="round"/>
    <circle id="orbit-source" cx="347.452" cy="160.673" r="16" fill="url(#orbit-source-fill)"/>
  </g>
</svg>
