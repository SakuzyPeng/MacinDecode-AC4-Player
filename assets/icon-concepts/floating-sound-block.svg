<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="block-title block-description">
  <title id="block-title">MacinDecode — 悬浮声块</title>
  <desc id="block-description">奶油白圆角底座上的陶橙色立体声块，正面镂空播放三角，底部投下柔和阴影。</desc>
  <defs>
    <linearGradient id="block-tile-fill" x1="256" y1="28" x2="256" y2="484" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFEFA"/>
      <stop offset="1" stop-color="#F5EDE0"/>
    </linearGradient>
    <filter id="block-tile-shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#332A1F" flood-opacity="0.14"/>
    </filter>
    <filter id="block-ground-blur" x="112" y="368" width="304" height="84" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <mask id="block-play-cutout" x="0" y="0" width="512" height="512" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" style="mask-type:luminance">
      <rect width="512" height="512" fill="white"/>
      <path d="M 55 47 Q 55 40 61 43 L 118 75 Q 124 79 118 83 L 61 115 Q 55 119 55 111 Z" transform="matrix(1 .220859 0 1 140 176)" fill="black"/>
    </mask>
  </defs>
  <g id="block-base">
    <rect x="28" y="24" width="456" height="456" rx="104" fill="url(#block-tile-fill)" filter="url(#block-tile-shadow)"/>
    <rect x="28.75" y="24.75" width="454.5" height="454.5" rx="103.25" stroke="#E9DECE" stroke-width="1.5"/>
    <path d="M 55 100 C 69 62 98 38 146 36 H 366 C 414 36 443 62 457 100" stroke="#FFFEFA" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>
  <g id="block-symbol">
    <ellipse cx="264" cy="409" rx="98" ry="10" fill="#70543C" opacity="0.19" filter="url(#block-ground-blur)"/>
    <path id="block-top-face" d="M 140 176 L 211 125 L 374 161 L 303 212 Z" fill="#E6A36D"/>
    <path id="block-right-face" d="M 303 212 L 374 161 V 320 L 303 371 Z" fill="#A75D35"/>
    <path id="block-front-face" d="M 140 176 L 303 212 V 371 L 140 335 Z" fill="#CE7A3B" mask="url(#block-play-cutout)"/>
    <path d="M 141 176.3 L 303 212 L 373 161.7" stroke="#FFE6C9" stroke-width="1.5" stroke-linejoin="round" opacity="0.47"/>
  </g>
</svg>
