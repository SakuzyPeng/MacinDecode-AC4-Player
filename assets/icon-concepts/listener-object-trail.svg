  <title id="listener-title">MacinDecode — 听众与对象轨迹</title>
  <desc id="listener-description">默认灰褐色体素听众头部，带深色方眼和陶橙色朝向块。一个陶橙色对象沿倾斜轨道环绕头部，留下固定大小、逐渐淡出的离散方块轨迹。</desc>
